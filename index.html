<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بیت‌یاب</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg1:#1d3b2a;--bg2:#0e1f16;--tile:#3f6b4e;--tile2:#2f5640;--acc:#e8c766;--ink:#fff8e6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font-family:'Vazirmatn',Tahoma,sans-serif;color:var(--ink);
background:radial-gradient(circle at 50% 0,var(--bg1),var(--bg2) 75%);background-color:var(--bg2);transition:background .6s}
.wrap{max-width:480px;margin:0 auto;padding:10px 12px 28px;text-align:center}
.top{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.badge{background:#0004;border:1px solid #fff3;border-radius:14px;padding:5px 10px;font-size:13px;white-space:nowrap}
h1{margin:6px 0 0;font-size:24px;font-weight:900;color:var(--acc)}
.sub{font-size:13px;opacity:.85;margin:2px 0 8px}
.orn{height:10px;margin:4px auto 8px;width:70%;background:radial-gradient(circle,var(--acc) 3px,transparent 4px) 0 0/22px 10px repeat-x;opacity:.7}
#bw{overflow:auto;max-width:100%;padding:4px}
#board{display:grid;gap:5px;justify-content:center;width:max-content;margin:0 auto;direction:ltr}
#board.hit{animation:sh .4s}
.c{position:relative;width:var(--s);height:var(--s);border:0;border-radius:10px;font:900 18px 'Vazirmatn',sans-serif;color:var(--ink);
background:conic-gradient(from 45deg,var(--tile) 0 25%,var(--tile2) 0 50%,var(--tile) 0 75%,var(--tile2) 0);
box-shadow:inset 0 -3px 0 #0005,0 2px 4px #0004;cursor:pointer;padding:0;transition:transform .1s;direction:rtl}
.c:active{transform:scale(.92)}
body[data-style=round] .c:not(.o){border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--tile),var(--tile2))}
body[data-style=glass] .c:not(.o){background:#ffffff22;border:1px solid #fff5;backdrop-filter:blur(3px)}
body[data-style=wood] .c:not(.o){background:repeating-linear-gradient(90deg,var(--tile) 0 6px,var(--tile2) 6px 12px)}
.c.o{background:#0003;box-shadow:inset 0 2px 4px #0006;cursor:default}
.c.w{background:linear-gradient(135deg,var(--acc),#fff3b0);color:#3a2800;animation:pop .35s;white-space:nowrap;overflow:hidden}
.c.w i{position:absolute;left:4px;bottom:1px;font:700 10px 'Vazirmatn',sans-serif;font-style:normal;opacity:.7}
.c.t{background:#7a1f2b;animation:pop .35s,glow 1.2s infinite alternate}
.c.t span{display:inline-block;animation:wob .9s infinite ease-in-out}
@keyframes wob{0%,100%{transform:rotate(-14deg) scale(1)}50%{transform:rotate(14deg) scale(1.2)}}
@keyframes glow{to{box-shadow:0 0 14px #ff3b4e}}
@keyframes pop{0%{transform:scale(.5)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.noanim *{animation:none!important}
.n1{color:#7fd3ff}.n2{color:#9be58f}.n3{color:#ff9a8a}.n4{color:#d9a6ff}.n5{color:#ffc277}.n6{color:#7ff0e0}
.ctl{display:flex;gap:6px;justify-content:center;margin:10px 0 6px;flex-wrap:wrap}
button.b{font:700 14px 'Vazirmatn',sans-serif;border:0;border-radius:12px;padding:8px 12px;background:#fff2;color:var(--ink);cursor:pointer}
button.b.on{background:var(--acc);color:#3a2800}
button.big{background:var(--acc);color:#3a2800;font-size:16px;padding:11px 26px}
.ov{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:16px;z-index:5}
.ov.show{display:flex}
.card{position:relative;width:100%;max-width:440px;background:linear-gradient(160deg,var(--bg1),var(--bg2));border:2px solid var(--acc);border-radius:20px;padding:20px 14px 16px;max-height:92vh;overflow:auto;text-align:center}
.x{position:absolute;top:8px;left:8px;width:34px;height:34px;border-radius:50%;border:0;background:#fff2;color:var(--ink);font-size:16px;cursor:pointer}
.line{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0;padding:8px;border-radius:12px;background:#0003;min-height:50px}
.slot{min-width:44px;height:34px;border-radius:9px;border:1.5px dashed #fff5;padding:4px 8px;font-weight:700;font-size:16px}
.slot.f{border:1.5px solid var(--acc);background:#0005;color:var(--acc);cursor:pointer}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.pw{background:linear-gradient(135deg,var(--acc),#fff3b0);color:#3a2800;border:0;border-radius:11px;padding:7px 13px;font:900 16px 'Vazirmatn',sans-serif;cursor:pointer}
.pw.u{opacity:.25;pointer-events:none}
.shake{animation:sh .4s}
.poem{font-size:19px;font-weight:700;line-height:2.1;color:var(--acc);margin:10px 0}
.row{display:flex;gap:8px;justify-content:center;margin:10px 0;flex-wrap:wrap;align-items:center}
.st{font-size:30px;letter-spacing:4px}
input[type=text],select{font:16px 'Vazirmatn',sans-serif;border-radius:10px;border:1px solid var(--acc);background:#0006;color:var(--ink);padding:9px;text-align:center}
.lg{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px}
.lv{background:#0004;border:1px solid #fff3;border-radius:12px;padding:8px 4px;color:var(--ink);font:700 13px 'Vazirmatn',sans-serif;cursor:pointer}
.lv.lk{opacity:.4;cursor:not-allowed}.lv.cur{border-color:var(--acc)}
.lb{width:100%;border-collapse:collapse;font-size:14px}.lb td{padding:6px 4px;border-bottom:1px solid #fff2}.lb tr.me{color:var(--acc);font-weight:900}
.leaf{position:fixed;top:-40px;font-size:24px;z-index:9;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),115vh) rotate(720deg)}}
.set{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:9px 0;font-size:14px}
</style>
</head>
<body data-style="tile">
<div class="wrap">
  <div class="top"><span class="badge" id="who"></span><span class="badge" id="lvl"></span><span class="badge" id="tm">⏱ ۰۰:۰۰</span><span class="badge" id="hp"></span></div>
  <h1>بیت‌یاب</h1>
  <div class="sub" id="place"></div>
  <div class="orn"></div>
  <div id="bw"><div id="board"></div></div>
  <div class="ctl">
    <button class="b" id="flag">🚩 پرچم</button><button class="b" id="zo">➖</button><button class="b" id="zi">➕</button>
    <button class="b" id="again">↻</button><button class="b" id="re" style="display:none">🧩 چیدن بیت</button>
  </div>
  <div class="ctl">
    <button class="b" id="map">🗺 مراحل</button><button class="b" id="lbb">🏆 برترین‌ها</button><button class="b" id="set">⚙️</button><button class="b" id="snd">🔊</button>
  </div>
  <div class="sub" id="prog"></div>
  <div class="sub" id="credit" style="opacity:.6"></div>
</div>
<div class="ov" id="ov"><div class="card" id="card"></div></div>
<div id="lv_fx"></div>
<script>window.__err=[];window.addEventListener("error",function(e){if(e.filename)window.__err.push(e.filename.split("/").pop()+": "+e.message)})</script>
<script src="poems.js"></script>
<script src="config.js"></script>
<script>
const CFG=Object.assign({AUTHOR:'',MUSIC_CREDIT:'',API_URL:'',FIREBASE_URL:''},window.CONFIG||{});if(!CFG.MUSIC_URL)CFG.MUSIC_URL='3Tar.mp3';
const TH=[['توس','#1d3b2a','#0e1f16','#3f6b4e','#2f5640','#e8c766'],['نیشابور','#0f4c5c','#071f27','#2aa6a0','#1e7f86','#ffd98a'],
['شیراز','#6b1f3a','#2a0b17','#b9566f','#8e3b52','#ffd6a5'],['اصفهان','#14337a','#071433','#2f6fd0','#2455a8','#9ee7ff'],
['یزد','#7a4a1f','#2a1808','#c58a4e','#9c6a36','#ffe3a8'],['تخت جمشید','#2b2b4a','#0a0a1a','#6b6aa8','#504f86','#f2c94c']];
const PV=[['آذربایجان شرقی',8],['آذربایجان غربی',205],['اردبیل',190],['البرز',100],['ایلام',125],['بوشهر',182],['تهران',218],['چهارمحال و بختیاری',160],
['خراسان جنوبی',32],['خراسان رضوی',52],['خراسان شمالی',72],['خوزستان',22],['زنجان',240],['سمنان',42],['سیستان و بلوچستان',14],['فارس',335],
['قزوین',262],['قم',172],['کردستان',148],['کرمان',28],['کرمانشاه',112],['کهگیلویه و بویراحمد',88],['گلستان',132],['گیلان',152],
['لرستان',170],['مازندران',140],['مرکزی',300],['هرمزگان',196],['همدان',280],['استان اصفهان',222],['استان یزد',48]];
PV.forEach(([n,h])=>TH.push([n.startsWith('استان')?n:'استان '+n,`hsl(${h},45%,22%)`,`hsl(${h},50%,9%)`,`hsl(${h},36%,42%)`,`hsl(${h},38%,31%)`,`hsl(${(h+40)%360},75%,72%)`]));
const DIF={easy:{n:'آسان',h:5,m:.6},normal:{n:'متوسط',h:3,m:1},hard:{n:'سخت',h:2,m:1.5}};
const $=i=>document.getElementById(i);
const fa=n=>(+n).toLocaleString('fa-IR');
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const J=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const W=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const mmss=s=>fa(String(Math.floor(s/60)).padStart(2,'0'))+':'+fa(String(s%60).padStart(2,'0'));

let S=Object.assign({dif:'normal',music:1,sfx:1,vol:.5,theme:'auto',style:'tile',anim:1,zoom:1},J('bayt_S',{}));
let user=J('bayt_user',null),prog=user?J('bayt_prog_'+user.key,{}):{};
let P,cells,hearts,flag,started,found,over,words,rowsW,G,li=0,phase='play',AR,t0=0,tmr,D;

/* ---------- شعر و ساخت مرحله ---------- */
const parse=t=>t.replace(/ي/g,'ی').replace(/ك/g,'ک').split(/\n|\/|\|/).map(l=>l.replace(/[.,،؛:!؟?"«»()\[\]…\-–—]/g,' ').trim().split(/\s+/).filter(Boolean)).filter(a=>a.length);
P=(window.POEMS||[]).map(parse).filter(a=>a.length);
function gen(k){let pi=0,ptr=0,out;
for(let i=0;i<=k;i++){const tg=Math.min(4+Math.floor(i*1.4),30);let ch=[],n=0;
if(ptr>=P[pi].length){pi=(pi+1)%P.length;ptr=0}
while(ptr<P[pi].length&&(n<tg||!ch.length)){const l=P[pi][ptr];if(ch.length&&n+l.length>tg+4)break;ch.push(l);n+=l.length;ptr++}
out=ch}return out}
const doneCount=()=>{let d=0;while(prog[d])d++;return d};
const totalStars=()=>Object.values(prog).reduce((a,x)=>a+x.s,0);

/* ---------- صدا و موسیقی ---------- */
let AC,MG,SG,ext,SC=[293.66,311.13,369.99,392,440,466.16,523.25,587.33],mi=3;
function applyVol(){if(!AC)return;MG.gain.value=S.music?S.vol*.5:0;SG.gain.value=S.sfx?S.vol:0;if(ext)ext.volume=S.music?S.vol*.7:0;$('snd').textContent=(S.music||S.sfx)?'🔊':'🔇'}
function tone(f,t,d,ty,v,dest){const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(dest);o.start(t);o.stop(t+d+.05)}
let synthOn=0,extFail=0,mstat='موزیک داخلی بازی';
function synth(){if(synthOn||!AC)return;synthOn=1;[73.42,110].forEach(f=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(MG);o.start()});
setInterval(()=>{if(S.music&&Math.random()<.65){mi=Math.max(0,Math.min(7,mi+(Math.random()*5|0)-2));tone(SC[mi],AC.currentTime,1.3,'triangle',.25,MG)}},480)}
function initAudio(){try{
if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();SG=AC.createGain();
const d=AC.createDelay(),fb=AC.createGain();d.delayTime.value=.33;fb.gain.value=.4;d.connect(fb);fb.connect(d);MG.connect(AC.destination);MG.connect(d);d.connect(AC.destination);SG.connect(AC.destination)}
if(AC.state==='suspended')AC.resume();
if(CFG.MUSIC_URL&&!ext&&!extFail){ext=new Audio(CFG.MUSIC_URL);ext.loop=true;mstat='در حال بارگذاری موزیک...';ext.onplaying=()=>{mstat='✅ موزیک تو در حال پخش است'};ext.onerror=()=>{const c=ext&&ext.error?ext.error.code:'';ext=null;extFail=1;mstat='❌ فایل موزیک بارگذاری نشد (کد '+c+'): نام فایل را چک کن'}}
if(ext){if(ext.paused&&S.music)ext.play().catch(e=>{if(e&&e.name==='NotSupportedError'){ext=null;extFail=1;mstat='❌ فرمت فایل پشتیبانی نمی‌شود؛ از mp3 استفاده کن'}})}
else if(!CFG.MUSIC_URL)synth();
applyVol()}catch(e){}}
function sfx(n){if(!AC||!S.sfx)return;const t=AC.currentTime,s=SG;
if(n==='tap')tone(520,t,.08,'sine',.3,s);
if(n==='word'){tone(660,t,.15,'triangle',.4,s);tone(880,t+.1,.2,'triangle',.4,s)}
if(n==='thorn')tone(110,t,.4,'sawtooth',.35,s);
if(n==='win')[523,659,784,1047].forEach((f,i)=>tone(f,t+i*.13,.4,'triangle',.4,s));
if(n==='lose')[330,262,196].forEach((f,i)=>tone(f,t+i*.2,.4,'sawtooth',.3,s))}
['click','touchend','keydown'].forEach(e=>document.addEventListener(e,initAudio));

/* ---------- ظاهر ---------- */
function look(){const t=S.theme==='auto'?TH[li%TH.length]:TH[+S.theme],s=document.documentElement.style;
['--bg1','--bg2','--tile','--tile2','--acc'].forEach((v,i)=>s.setProperty(v,t[i+1]));
document.body.dataset.style=S.style;document.body.classList.toggle('noanim',!S.anim);return t}
function leaves(){if(!S.anim)return;const f=$('lv_fx');for(let i=0;i<46;i++){const e=document.createElement('span');e.className='leaf';e.textContent=['🍁','🍂','🍃','🌸','🍁'][i%5];
e.style.left=Math.random()*100+'vw';e.style.setProperty('--dx',(Math.random()*160-80)+'px');e.style.animationDuration=(3+Math.random()*3)+'s';e.style.animationDelay=Math.random()*1.2+'s';f.appendChild(e);setTimeout(()=>e.remove(),7000)}}

/* ---------- کارت‌ها ---------- */
function card(h,closable=true){$('card').innerHTML=(closable?'<button class="x" id="xb">✕</button>':'')+h;$('ov').className='ov show';if(closable)$('xb').onclick=closeOv}
function closeOv(){$('ov').className='ov';$('re').style.display=phase==='arrange'?'':'none'}
$('re').onclick=()=>arrangeShow();

/* ---------- نام کاربری و سرور ---------- */
const nkey=n=>n.trim().replace(/ي/g,'ی').replace(/ك/g,'ک').toLowerCase().replace(/\s+/g,'_');
const tf=(u,o)=>{const c=new AbortController();setTimeout(()=>c.abort(),8000);return window.fetch(u,Object.assign({signal:c.signal},o))};let srv='';
const fb=k=>CFG.FIREBASE_URL.replace(/\/$/,'')+'/users'+(k?'/'+encodeURIComponent(k):'')+'.json';
function login(msg){card('<h2 style="margin:0;color:var(--acc)">خوش آمدی 👋</h2><div class="sub">یک نام کاربری یکتا انتخاب کن (۲ تا ۱۶ حرف، عدد یا _)</div>'+
(msg?'<div class="sub" style="color:#ff9a8a">'+msg+'</div>':'')+'<div class="row"><input type="text" id="nm" maxlength="16" placeholder="نام کاربری"></div><button class="b big" id="go">ورود</button>',false);
$('go').onclick=async()=>{const n=$('nm').value.trim(),k=nkey(n);
if(!/^[\u0600-\u06FFa-z0-9_\u200c]{2,16}$/.test(k))return login('نام نامعتبر است');
let token='',off=0;
if(CFG.API_URL){try{$('go').textContent='...';const r=await tf(CFG.API_URL+'/register',{method:'POST',body:JSON.stringify({key:k,name:n})});
if(r.status===409)return login('این نام قبلاً گرفته شده، نام دیگری انتخاب کن');if(!r.ok)throw 0;token=(await r.json()).token}catch(e){off=1}}
if(CFG.FIREBASE_URL){try{$('go').textContent='...';const r=await tf(fb(k),{method:'PUT',headers:{'if-match':'null_etag'},body:JSON.stringify({n:n,s:0,d:0,t:0})});if(r.status===412)return login('این نام قبلاً گرفته شده، نام دیگری انتخاب کن');if(!r.ok)throw 0}catch(e){off=1}}
user={name:n,key:k,token,offline:off};W('bayt_user',user);prog=J('bayt_prog_'+k,{});initAudio();start(doneCount())}}
async function sync(){W('bayt_prog_'+user.key,prog);if(user.offline)return;
const tt=Object.values(prog).reduce((a,x)=>a+x.t,0),d=Object.keys(prog).length;
try{let r;if(CFG.FIREBASE_URL)r=await tf(fb(user.key),{method:'PUT',body:JSON.stringify({n:user.name,s:totalStars(),d:d,t:tt})});
else if(CFG.API_URL)r=await tf(CFG.API_URL+'/score',{method:'POST',body:JSON.stringify({key:user.key,token:user.token,s:totalStars(),d:d,t:tt})});
srv=r&&!r.ok?'❌ ارسال امتیاز ناموفق (کد '+r.status+')':''}catch(e){srv='❌ اتصال به سرور برقرار نشد'}}
async function connect(){if(!user.offline||!CFG.FIREBASE_URL)return;
try{const tt=Object.values(prog).reduce((a,x)=>a+x.t,0);
const r=await tf(fb(user.key),{method:'PUT',headers:{'if-match':'null_etag'},body:JSON.stringify({n:user.name,s:totalStars(),d:Object.keys(prog).length,t:tt})});
if(r.ok){user.offline=0;W('bayt_user',user);srv=''}else srv=r.status===412?'❌ این نام روی سرور قبلاً ثبت شده؛ باید نام کاربری را عوض کنی':'❌ خطای سرور (کد '+r.status+')'}
catch(e){srv='❌ اتصال به سرور برقرار نشد (شاید فیلتر باشد)'}}

/* ---------- بازی ---------- */
const nb=i=>{const x=i%G.c,y=i/G.c|0,o=[];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const a=x+dx,b=y+dy;if(a>=0&&a<G.c&&b>=0&&b<G.r)o.push(b*G.c+a)}return o};
function start(k){if(!user)return login();
if(!P.length){card('<h2 style="margin:0;color:var(--acc)">📜 شعری نیست</h2><p>فایل poems.js را باز کن و شعرها را اضافه کن.</p>');return}
if(k>doneCount())k=doneCount();li=k;D=DIF[S.dif];const t=look();
rowsW=gen(k);words=[].concat(...rowsW);
let N=Math.round(words.length*Math.max(1.7,2.2-.012*k)+8);const c=N<=30?5:6,r=Math.ceil(N/c);N=c*r;
let th=Math.round(N*Math.min(.33,(.12+.012*Math.min(k,45)))*D.m);th=Math.max(2,Math.min(th,N-9-words.length));
G={c,r,t:th};hearts=D.h;over=false;started=false;flag=false;found=0;phase='play';AR=null;clearInterval(tmr);t0=0;$('tm').textContent='⏱ '+mmss(0);
cells=Array.from({length:N},()=>({t:0,w:-1,a:0,o:0,f:0}));
$('ov').className='ov';$('re').style.display='none';
$('place').textContent=t[0]+' · '+fa(words.length)+' کلمه · '+D.n;
const bd=$('board');bd.innerHTML='';buildBoard();draw()}
function buildBoard(){const sz=Math.round(Math.min(62,Math.floor((Math.min(innerWidth,480)-30-5*(G.c-1))/G.c))*S.zoom),bd=$('board');
bd.style.setProperty('--s',sz+'px');bd.style.gridTemplateColumns='repeat('+G.c+',var(--s))';
if(!bd.children.length)cells.forEach((_,i)=>{const e=document.createElement('button');e.className='c';e.id='c'+i;
e.onclick=()=>{if(e._lp){e._lp=0;return}tap(i)};e.oncontextmenu=v=>{v.preventDefault();toggleF(i)};
let tm;e.onpointerdown=()=>{tm=setTimeout(()=>{e._lp=1;toggleF(i)},420)};e.onpointerup=e.onpointerleave=()=>clearTimeout(tm);bd.appendChild(e)})}
function place(first){const safe=[first,...nb(first)],all=cells.map((_,i)=>i);
shuf(all.filter(i=>!safe.includes(i))).slice(0,G.t).forEach(i=>cells[i].t=1);
shuf(all.filter(i=>!cells[i].t)).slice(0,words.length).forEach((i,n)=>cells[i].w=n);
cells.forEach((c,i)=>c.a=nb(i).filter(j=>cells[j].t).length)}
function toggleF(k){if(over||cells[k].o)return;cells[k].f=!cells[k].f;sfx('tap');draw()}
function tap(k){if(over)return;if(flag){toggleF(k);return}if(cells[k].f||cells[k].o)return;
if(!started){started=true;place(k);t0=Date.now();tmr=setInterval(()=>$('tm').textContent='⏱ '+mmss(Math.floor((Date.now()-t0)/1000)),1000)}
const st=[k];let gotW=0,gotT=0;
while(st.length){const i=st.pop(),c=cells[i];if(c.o||c.f)continue;c.o=1;if(c.t){hearts--;gotT++;continue}if(c.w>=0){found++;gotW++}
if(c.a===0)nb(i).forEach(j=>{if(!cells[j].o&&!cells[j].t)st.push(j)})}
sfx(gotT?'thorn':gotW?'word':'tap');
if(gotT&&S.anim){const b=$('board');b.classList.remove('hit');void b.offsetWidth;b.classList.add('hit')}
draw();
if(hearts<=0){over=true;clearInterval(tmr);sfx('lose');cells.forEach(c=>{if(c.t)c.o=1});draw();
setTimeout(()=>{card('<h2 style="margin:0;color:var(--acc)">🥀 خار زیاد خوردی</h2><p>دوباره تلاش کن؛ خارها جای تازه‌ای دارند.</p><button class="b big" id="mb">تلاش دوباره</button>');$('mb').onclick=()=>start(li)},800)}
else if(found===words.length){over=true;clearInterval(tmr);phase='arrange';setTimeout(()=>{AR={pool:shuf(words.map((_,i)=>i)),pick:[]};arrangeShow()},700)}}
function draw(){const sz=parseInt($('board').style.getPropertyValue('--s'));
cells.forEach((c,i)=>{const e=$('c'+i);e.className='c';e.innerHTML='';
if(c.o){e.className+=' o';
if(c.t){e.className+=' t';e.innerHTML='<span>🥀</span>'}
else if(c.w>=0){const w=words[c.w],fs=Math.max(8,Math.min(16,(sz-8)/(w.length*.52)));e.className+=' w';e.innerHTML='<span style="font-size:'+fs+'px">'+w+'</span>'+(c.a?'<i>'+fa(c.a)+'</i>':'')}
else if(c.a){e.className+=' n'+c.a;e.textContent=fa(c.a)}}else if(c.f)e.textContent='🚩'});
$('hp').textContent='❤️'.repeat(Math.max(hearts,0));$('flag').className='b'+(flag?' on':'');
$('who').textContent='👤 '+user.name+' · ⭐'+fa(totalStars());$('lvl').textContent='مرحله '+fa(li+1);
$('prog').textContent='کلمه‌های پیداشده: '+fa(found)+' از '+fa(words.length)}

/* ---------- چیدن بیت ---------- */
function arrangeShow(){const pick=AR.pick;let h='<h2 style="margin:0;color:var(--acc)">بیت را بچین</h2><div class="sub">کلمه‌ها را به ترتیب درست بزن</div><div id="lines">',n=0;
rowsW.forEach(m=>{h+='<div class="line">';m.forEach(()=>{const p=pick[n];h+=p!==undefined?'<span class="slot f" data-n="'+n+'">'+words[p]+'</span>':'<span class="slot"></span>';n++});h+='</div>'});
h+='</div><div class="pool">'+AR.pool.map(i=>'<button class="pw'+(pick.includes(i)?' u':'')+'" data-i="'+i+'">'+words[i]+'</button>').join('')+'</div><button class="b" id="clr">پاک‌کردن</button>';
card(h);$('re').style.display='none';
document.querySelectorAll('.pw').forEach(b=>b.onclick=()=>{sfx('tap');pick.push(+b.dataset.i);arrangeShow();if(pick.length===words.length)check()});
document.querySelectorAll('.slot.f').forEach(s=>s.onclick=()=>{pick.splice(+s.dataset.n,1);arrangeShow()});
$('clr').onclick=()=>{AR.pick=[];arrangeShow()}}
function check(){if(AR.pick.every((p,i)=>words[p]===words[i]))return win();
sfx('lose');$('lines').className='shake';setTimeout(()=>{AR.pick=[];arrangeShow()},450)}
function win(){phase='done';const el=Math.floor((Date.now()-t0)/1000),st=Math.max(1,3-(D.h-hearts)),old=prog[li];let msg='';
if(!old||st>old.s||(st===old.s&&el<old.t)){prog[li]={s:st,t:el};msg=old?'🎉 رکورد جدید!':''}
sync();draw();sfx('win');leaves();
card('<h2 style="margin:0;color:var(--acc)">آفرین! '+msg+'</h2><div class="st">'+'⭐'.repeat(st)+'☆'.repeat(3-st)+'</div><div class="sub">زمان: '+mmss(el)+' · بهترین: ⭐'+fa(prog[li].s)+' در '+mmss(prog[li].t)+'</div>'+
'<div class="poem">'+rowsW.map(m=>m.join(' ')).join('<br>')+'</div><div class="row"><button class="b big" id="nx">مرحله‌ی بعد ←</button><button class="b" id="mp">🗺 مراحل</button></div>');
$('nx').onclick=()=>start(li+1);$('mp').onclick=showMap}

/* ---------- نقشه‌ی مراحل ---------- */
function showMap(){const d=doneCount();let h='<h2 style="margin:0 0 10px;color:var(--acc)">مراحل</h2><div class="lg">';
for(let i=0;i<d+7;i++){const p=prog[i],lk=i>d;
h+='<button class="lv'+(lk?' lk':'')+(i===li?' cur':'')+'" data-l="'+i+'">'+(lk?'🔒':'')+' '+fa(i+1)+'<br>'+(p?'⭐'.repeat(p.s)+'<br>'+mmss(p.t):lk?'':'▶')+'</button>'}
card(h+'</div>');document.querySelectorAll('.lv:not(.lk)').forEach(b=>b.onclick=()=>start(+b.dataset.l))}
$('map').onclick=showMap;

/* ---------- جدول برترین‌ها ---------- */
async function showLB(){card('<h2 style="margin:0 0 8px;color:var(--acc)">🏆 برترین‌ها</h2><div id="lbx" class="sub">در حال بارگذاری...</div>');
let rows=[],note='';const tt=Object.values(prog).reduce((a,x)=>a+x.t,0),me={n:user.name,s:totalStars(),d:Object.keys(prog).length,t:tt};
await connect();if(!user.offline)await sync();
try{if(CFG.FIREBASE_URL){const o=await(await tf(fb())).json()||{};rows=Object.entries(o).map(([k,v])=>({...v,k}))}
else if(CFG.API_URL)rows=(await(await tf(CFG.API_URL+'/users')).json()).map(v=>({...v,k:v.key}))}catch(e){note='❌ اتصال به سرور برقرار نشد (شاید فیلتر باشد)'}
if(srv)note=srv;if(user.offline&&(CFG.API_URL||CFG.FIREBASE_URL)&&!srv)note='حالت آفلاین: نام تو روی سرور ثبت نشده';
if(!CFG.API_URL&&!CFG.FIREBASE_URL)note='حالت آفلاین: فقط امتیاز همین دستگاه (برای جدول همه، آدرس سرور را در config.js بگذار)';
if(!rows.some(r=>r.k===user.key))rows.push({...me,k:user.key});
rows.sort((a,b)=>b.s-a.s||b.d-a.d||a.t-b.t);
$('lbx').outerHTML=(note?'<div class="sub">'+note+'</div>':'')+'<table class="lb">'+rows.slice(0,30).map((r,i)=>'<tr class="'+(r.k===user.key?'me':'')+'"><td>'+(['🥇','🥈','🥉'][i]||fa(i+1))+'</td><td>'+String(r.n).replace(/</g,'&lt;')+'</td><td>⭐'+fa(r.s)+'</td><td>'+fa(r.d)+' مرحله</td><td>'+mmss(r.t)+'</td></tr>').join('')+'</table>'}
$('lbb').onclick=showLB;

/* ---------- تنظیمات ---------- */
async function diag(){const m=$('ms');if(!m)return;
if(!CFG.MUSIC_URL){m.textContent='MUSIC_URL در config.js خالی است (یا config.js قدیمی بارگذاری شده)؛ آدرس فعلی: (خالی)';return}
try{const r=await tf(CFG.MUSIC_URL,{method:'HEAD'});m.textContent='آدرس: '+CFG.MUSIC_URL+' | پاسخ سرور: '+r.status+' | نوع: '+(r.headers.get('content-type')||'?')+' | حجم: '+Math.round((+r.headers.get('content-length')||0)/1024)+'KB | '+mstat+(window.__err.length?' | خطای فایل: '+window.__err.join(' ; '):'')}
catch(e){m.textContent='آدرس: '+CFG.MUSIC_URL+' | دسترسی به فایل ممکن نشد | '+mstat}}
function settings(){const o=(id,arr,cur)=>'<select id="'+id+'">'+arr.map(a=>'<option value="'+a[0]+'"'+(String(a[0])===String(cur)?' selected':'')+'>'+a[1]+'</option>').join('')+'</select>';
card('<h2 style="margin:0;color:var(--acc)">تنظیمات</h2>'+
'<div class="set">سختی'+o('sd',Object.keys(DIF).map(k=>[k,DIF[k].n]),S.dif)+'</div>'+
'<div class="set">تم تصویری'+o('st',[['auto','خودکار (هر مرحله شهری)'],...TH.map((t,i)=>[i,t[0]])],S.theme)+'</div>'+
'<div class="set">سبک خانه‌ها'+o('ss',[['tile','کاشی'],['round','گرد'],['glass','شیشه‌ای'],['wood','چوبی']],S.style)+'</div>'+
'<div class="set">موسیقی'+o('sm',[[1,'روشن'],[0,'خاموش']],S.music)+'</div>'+
'<div class="set">جلوه‌های صوتی'+o('sx',[[1,'روشن'],[0,'خاموش']],S.sfx)+'</div>'+
'<div class="set">انیمیشن'+o('sa',[[1,'روشن'],[0,'خاموش']],S.anim)+'</div>'+
'<div class="set">بلندی صدا<input type="range" id="sv" min="0" max="1" step=".05" value="'+S.vol+'"></div>'+
'<div class="set">اندازه‌ی خانه‌ها<input type="range" id="sz" min=".7" max="1.6" step=".1" value="'+S.zoom+'"></div>'+
(mstat.includes('❌')||window.__err.length?'<div class="sub">'+mstat+(window.__err.length?' | '+window.__err.join(' ; ').replace(/</g,'&lt;'):'')+'</div>':'')+'<div class="sub">سختی از مرحله‌ی بعد اعمال می‌شود</div><button class="b big" id="ok">ذخیره</button>');
$('ok').onclick=()=>{S.dif=$('sd').value;S.theme=$('st').value;S.style=$('ss').value;S.music=+$('sm').value;S.sfx=+$('sx').value;S.anim=+$('sa').value;S.vol=+$('sv').value;S.zoom=+$('sz').value;
W('bayt_S',S);applyVol();look();if(cells){D=DIF[S.dif];buildBoard();draw()}closeOv()}}
$('set').onclick=settings;
$('snd').onclick=()=>{initAudio();const on=!(S.music||S.sfx);S.music=S.sfx=on?1:0;W('bayt_S',S);applyVol();$('snd').textContent=on?'🔊':'🔇'};
$('flag').onclick=()=>{flag=!flag;draw()};$('again').onclick=()=>start(li);
const zoom=d=>{S.zoom=Math.max(.7,Math.min(1.6,+(S.zoom+d).toFixed(1)));W('bayt_S',S);buildBoard();draw()};
$('zi').onclick=()=>zoom(.1);$('zo').onclick=()=>zoom(-.1);

$('credit').innerHTML=[CFG.AUTHOR?'ساخته‌شده توسط '+CFG.AUTHOR:'',CFG.MUSIC_CREDIT?'موزیک: '+CFG.MUSIC_CREDIT:''].filter(Boolean).map(x=>x.replace(/</g,'&lt;')).join(' · ');
user?start(doneCount()):login();
</script>
</body>
</html>
